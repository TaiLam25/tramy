<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cảm ơn em yêu 🌸</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="experience-wrapper">
        <!-- 3D WebGL Canvas -->
        <canvas id="webgl-canvas"></canvas>

        <!-- Touch / Click Ripple -->
        <div id="touch-ripple" class="touch-ripple"></div>

        <!-- Initial Gentle Guidance Hint -->
        <div id="prompt-hint" class="prompt-hint">
            <span class="sparkle">✨</span>
            <span class="hint-text">Chạm vào cây hoa nhé 🌸</span>
            <span class="sparkle">✨</span>
        </div>

        <!-- Heartfelt Message Reveal with Side-by-Side Photos -->
        <div id="message-container" class="message-container">
            <div class="reveal-content-wrapper">
                <!-- Left Photo Card -->
                <div class="photo-card photo-card-left">
                    <div class="photo-glow"></div>
                    <img src="photo1.png" alt="Kỷ niệm" class="couple-photo">
                    <span class="photo-sparkle-tag">✨</span>
                </div>

                <!-- Center Message Card -->
                <div class="message-card">
                    <div class="card-glow-aura"></div>
                    
                    <!-- Cute Boba Milk Tea Cup with Sparkles -->
                    <div class="boba-icon-wrapper" title="Ly trà sữa ngọt ngào 🧋">
                        <svg class="boba-svg" viewBox="0 0 64 80" width="56" height="70" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="teaGrad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#fff8f2" />
                                    <stop offset="25%" stop-color="#f7cca8" />
                                    <stop offset="75%" stop-color="#e39a66" />
                                    <stop offset="100%" stop-color="#b86532" />
                                </linearGradient>
                                <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="0">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
                                    <stop offset="35%" stop-color="rgba(255,255,255,0.12)" />
                                    <stop offset="85%" stop-color="rgba(255,255,255,0.3)" />
                                    <stop offset="100%" stop-color="rgba(255,255,255,0.5)" />
                                </linearGradient>
                                <linearGradient id="strawGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#ff758c" />
                                    <stop offset="100%" stop-color="#ff9ff3" />
                                </linearGradient>
                            </defs>

                            <!-- Straw -->
                            <path d="M35 8 L44 1 L49 7 L39 28" fill="url(#strawGrad)" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

                            <!-- Cup Lid -->
                            <ellipse cx="32" cy="24" rx="20" ry="5.5" fill="rgba(255,255,255,0.7)" stroke="#ffffff" stroke-width="1.4" />

                            <!-- Cup Body (Trapezoid) -->
                            <path d="M14 26 L19 72 C19.5 75.5 22.5 78 26 78 L38 78 C41.5 78 44.5 75.5 45 72 L50 26 Z" fill="url(#cupGrad)" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" />

                            <!-- Milk Tea Liquid Fill -->
                            <path d="M15.2 30 L19.5 70 C19.8 73 22.5 75 25.5 75 L38.5 75 C41.5 75 44.2 73 44.5 70 L48.8 30 Q32 34 15.2 30 Z" fill="url(#teaGrad)" />

                            <!-- Cream Cheese / Milk Foam Layer -->
                            <path d="M15.2 30 C20 33 26 31 32 33 C38 31 44 33 48.8 30 L48.2 36 Q32 40 15.8 36 Z" fill="#ffffff" opacity="0.88" />

                            <!-- Boba Pearls -->
                            <circle cx="24" cy="68" r="3.2" fill="#2d150b" />
                            <circle cx="31" cy="70" r="3.2" fill="#381b10" />
                            <circle cx="38" cy="69" r="3.2" fill="#2d150b" />
                            <circle cx="27" cy="63" r="3.2" fill="#3e1d12" />
                            <circle cx="34" cy="64" r="3.2" fill="#2d150b" />
                            <circle cx="41" cy="64" r="3.2" fill="#351a0f" />
                            
                            <!-- Boba Pearl Glints -->
                            <circle cx="23" cy="67" r="0.9" fill="#ffffff" opacity="0.65" />
                            <circle cx="30" cy="69" r="0.9" fill="#ffffff" opacity="0.65" />
                            <circle cx="37" cy="68" r="0.9" fill="#ffffff" opacity="0.65" />
                            <circle cx="26" cy="62" r="0.9" fill="#ffffff" opacity="0.65" />
                            <circle cx="33" cy="63" r="0.9" fill="#ffffff" opacity="0.65" />

                            <!-- Glass Cup Reflection -->
                            <path d="M18 32 L21.5 68" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.55" />

                            <!-- Golden Sparkles on the Cup -->
                            <g class="boba-sparkle sparkle-left">
                                <path d="M8 18 Q12 18 12 14 Q12 18 16 18 Q12 18 12 22 Q12 18 8 18" fill="#f1c40f" />
                            </g>
                            <g class="boba-sparkle sparkle-right">
                                <path d="M48 42 Q52 42 52 38 Q52 42 56 42 Q52 42 52 46 Q52 42 48 42" fill="#f1c40f" />
                            </g>
                        </svg>
                    </div>

                    <p class="message-quote">
                        “Không phải là 20/10 mà là <span class="highlight-lover">cảm ơn em yêu</span> đã mua trà sữa cho tui hôm nay nhé”
                    </p>
                    <div class="card-shimmer-line"></div>
                </div>

                <!-- Right Photo Card -->
                <div class="photo-card photo-card-right">
                    <div class="photo-glow"></div>
                    <img src="photo2.png" alt="Kỷ niệm" class="couple-photo">
                    <span class="photo-sparkle-tag">✨</span>
                </div>
            </div>

            <!-- Replay Button -->
            <button id="replay-btn" class="replay-btn" title="Xem lại">
                <span>Xem lại 🌸</span>
            </button>
        </div>
    </div>

    <!-- Scripts (Loaded locally for 100% offline localhost reliability) -->
    <script src="three.min.js"></script>
    <script src="gsap.min.js"></script>
    <script src="audio.js"></script>
    <script src="tree.js"></script>
    <script src="petals.js"></script>
    <script src="main.js"></script>
</body>
</html>
